<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eureka — Content</title>
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
  <!--
    Sveltia CMS shell.

    Sveltia is a modern, drop-in replacement for Decap CMS — it reads the
    same config.yml schema, talks to the same git-gateway backend, and
    keeps the same DecapBridge PKCE auth. The only difference is the
    script tag below: better UI, faster, better lists/repeaters, real
    image handling, mobile-friendly.

    To revert to Decap: swap the script src back to
      https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js
    No other changes needed — same config.yml works for both editors.

    See https://github.com/sveltia/sveltia-cms
  -->
  <script type="module" src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
